<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepWeb | Official V1</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
    --black:#000;
    --dark:#111;
    --gray:#222;
    --border:#333;
    --white:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:var(--black);
    color:var(--white);
    overflow-x:hidden;
}

/* HEADER */
header{
    position:fixed;
    width:100%;
    top:0;
    left:0;
    background:rgba(0,0,0,0.95);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    z-index:1000;
}

.logo{
    font-weight:700;
    letter-spacing:1px;
}

.hamburger{
    font-size:24px;
    cursor:pointer;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:260px;
    height:100%;
    background:var(--dark);
    border-right:1px solid var(--border);
    padding:30px 20px;
    transition:0.4s ease;
    z-index:999;
}

.sidebar.active{
    left:0;
}

.sidebar h3{
    margin-bottom:25px;
    font-weight:600;
}

.sidebar a{
    display:block;
    margin-bottom:15px;
    text-decoration:none;
    color:var(--white);
    padding:10px;
    border-radius:6px;
    transition:0.3s;
}

.sidebar a:hover{
    background:var(--gray);
}

/* OVERLAY */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    z-index:998;
}

.overlay.active{
    opacity:1;
    pointer-events:all;
}

/* MAIN */
main{
    padding:100px 20px 40px;
    max-width:900px;
    margin:auto;
    transition:0.3s;
}

/* HERO LOGO SCREEN */
.hero{
    text-align:center;
    margin-top:100px;
}

.hero h1{
    font-size:32px;
    margin-bottom:15px;
}

.btn{
    padding:10px 18px;
    border:1px solid var(--white);
    background:none;
    color:var(--white);
    cursor:pointer;
    border-radius:6px;
    transition:0.3s;
}

.btn:hover{
    background:var(--white);
    color:var(--black);
}

/* NEWS CARD */
.news-grid{
    display:grid;
    gap:20px;
}

.news-card{
    background:var(--dark);
    border:1px solid var(--border);
    padding:20px;
    border-radius:10px;
    transition:0.3s;
}

.news-card:hover{
    transform:translateY(-5px);
    border-color:#555;
}

.news-card h3{
    margin-bottom:15px;
}

/* DETAIL */
.detail{
    display:none;
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* REQUEST */
.request{
    display:none;
}

textarea{
    width:100%;
    height:140px;
    background:var(--dark);
    border:1px solid var(--border);
    color:var(--white);
    padding:15px;
    border-radius:8px;
    resize:none;
    margin-bottom:15px;
}

/* RESPONSIVE */
@media(max-width:600px){
    .hero h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">DeepWeb | BlackNews</div>
    <div class="hamburger" onclick="toggleSidebar()">☰</div>
</header>

<div class="sidebar" id="sidebar">
    <h3>Menu</h3>
    <a href="#" onclick="goHome()">Home</a>
    <a href="#" onclick="openRequest()">Request</a>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<main>

<!-- HERO -->
<div class="hero" id="hero">
    <h1>Welcome To DeepWeb (Recode By Fahz)</h1>
    <p>Safe Browser For Indonesian People</p>
    <br>
    <button class="btn" onclick="enterSite()">Read News</button>
</div>

<!-- HOME -->
<div id="home" style="display:none;">
    <h2 style="margin-bottom:25px;">Black News</h2>
    <div class="news-grid" id="newsList"></div>
</div>

<!-- DETAIL -->
<div class="detail" id="detailPage"></div>

<!-- REQUEST -->
<div class="request" id="requestPage">
    <h2 style="margin-bottom:15px;">Request</h2>
    <textarea placeholder="Tulis pesan kamu disini..."></textarea>
    <button class="btn" onclick="goHome()">Back</button>
</div>

</main>

<script>
function toggleSidebar(){
    document.getElementById("sidebar").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function closeSidebar(){
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function enterSite(){
    document.getElementById("hero").style.display="none";
    document.getElementById("home").style.display="block";
}

function goHome(){
    document.getElementById("detailPage").style.display="none";
    document.getElementById("requestPage").style.display="none";
    document.getElementById("home").style.display="block";
    closeSidebar();
}

function openRequest(){
    document.getElementById("home").style.display="none";
    document.getElementById("detailPage").style.display="none";
    document.getElementById("requestPage").style.display="block";
    closeSidebar();
}

const newsData = [
{
title:"Mahasiswa UIN Dibacok",
kronologi:"Kampus Universitas Islam Negeri (UIN) Sultan Syarif Kasim (Suska) Riau geger pada Kamis (26/2/2026).

Pasalnya, terjadi peristiwa pembacokan terhadap seorang mahasiswi UIN Sultan Syarif Kasim (Suska) Riau.

Pelakunya adalah pacar korban yang juga seorang mahasiswa di kampus yang sama.

Pemicu pembacokan yang terjadi di pagi hari tersebut ditengarai faktor asmara.

Pelaku diduga sakit hati karena akan diputuskan oleh korban sehingga nekat melakukan pembacokan,



Artikel ini telah tayang di SerambiNews.com dengan judul Mahasiswa Bacok Mahasiswi di Kampus Gegara Diputusin, Begini Kronologisnya, https://aceh.tribunnews.com/news/1013701/mahasiswa-bacok-mahasiswi-di-kampus-gegara-diputusin-begini-kronologisnya.
",
video:"https://aceimg.com/upload/?f=d0a10106c.mp4"
},
{
title:"Kasus Viral Kota",
kronologi:"Kasus ini bermula dari laporan masyarakat dan menjadi viral dalam waktu singkat.",
video:"https://youtube.com/"
}
];

const newsList = document.getElementById("newsList");

newsData.forEach((news,index)=>{
    newsList.innerHTML += `
    <div class="news-card">
        <h3>${news.title}</h3>
        <button class="btn" onclick="openDetail(${index})">Baca Berita</button>
    </div>`;
});

function openDetail(index){
    const data = newsData[index];
    document.getElementById("home").style.display="none";
    const detail = document.getElementById("detailPage");

    detail.innerHTML = `
    <h2 style="margin-bottom:15px;">${data.title}</h2>
    <h3 style="margin-bottom:10px;">Kronologi</h3>
    <p style="margin-bottom:20px; line-height:1.6;">${data.kronologi}</p>
    <a href="${data.video}" target="_blank">
        <button class="btn">Link Video</button>
    </a>
    <br><br>
    <button class="btn" onclick="goHome()">Kembali</button>
    `;

    detail.style.display="block";
}
</script>

</body>
</html>
