<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahz-BlackNews</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
    /* LOADING VERIFICATION */
.verify-box{
    margin-top:20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.loader{
    width:40px;
    height:40px;
    border:4px solid #333;
    border-top:4px solid #fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}
    
:root{
    --black:#000;
    --dark:#111;
    --gray:#222;
    --border:#333;
    --white:#fff;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Inter', sans-serif;
    background:var(--black);
    color:var(--white);
    overflow-x:hidden;
}

/* HEADER */
header{
    position:fixed;
    width:100%;
    top:0;
    left:0;
    background:rgba(0,0,0,0.95);
    backdrop-filter:blur(10px);
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 20px;
    border-bottom:1px solid var(--border);
    z-index:1000;
}

.logo{
    font-weight:700;
    letter-spacing:1px;
}

.hamburger{
    font-size:24px;
    cursor:pointer;
}

/* SIDEBAR */
.sidebar{
    position:fixed;
    top:0;
    left:-260px;
    width:260px;
    height:100%;
    background:var(--dark);
    border-right:1px solid var(--border);
    padding:30px 20px;
    transition:0.4s ease;
    z-index:999;
}

.sidebar.active{
    left:0;
}

.sidebar h3{
    margin-bottom:25px;
    font-weight:600;
}

.sidebar a{
    display:block;
    margin-bottom:15px;
    text-decoration:none;
    color:var(--white);
    padding:10px;
    border-radius:6px;
    transition:0.3s;
}

.sidebar a:hover{
    background:var(--gray);
}

/* OVERLAY */
.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    opacity:0;
    pointer-events:none;
    transition:0.3s;
    z-index:998;
}

.overlay.active{
    opacity:1;
    pointer-events:all;
}

/* MAIN */
main{
    padding:100px 20px 40px;
    max-width:900px;
    margin:auto;
    transition:0.3s;
}

/* HERO LOGO SCREEN */
.hero{
    text-align:center;
    margin-top:100px;
}

.hero h1{
    font-size:32px;
    margin-bottom:15px;
}

.btn{
    padding:10px 18px;
    border:1px solid var(--white);
    background:none;
    color:var(--white);
    cursor:pointer;
    border-radius:6px;
    transition:0.3s;
}

.btn:hover{
    background:var(--white);
    color:var(--black);
}

/* NEWS CARD */
.news-grid{
    display:grid;
    gap:20px;
}

.news-card{
    background:var(--dark);
    border:1px solid var(--border);
    padding:20px;
    border-radius:10px;
    transition:0.3s;
}

.news-card:hover{
    transform:translateY(-5px);
    border-color:#555;
}

.news-card h3{
    margin-bottom:15px;
}

/* DETAIL */
.detail{
    display:none;
    animation:fade 0.4s ease;
}

@keyframes fade{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
}

/* REQUEST */
.request{
    display:none;
}

textarea{
    width:100%;
    height:140px;
    background:var(--dark);
    border:1px solid var(--border);
    color:var(--white);
    padding:15px;
    border-radius:8px;
    resize:none;
    margin-bottom:15px;
}

/* RESPONSIVE */
@media(max-width:600px){
    .hero h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">DeepWeb-BlackNews</div>
    <div class="hamburger" onclick="toggleSidebar()">☰</div>
</header>

<div class="sidebar" id="sidebar">
    <h3>Menu</h3>
    <a href="#" onclick="goHome()">Home</a>
    <a href="#" onclick="openRequest()">Request Kasus</a>
</div>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<main>

<!-- HERO -->
<div class="hero" id="hero">
    
    <img src="https://files.catbox.moe/d8h67z.png" 
         style="width:160px; margin-bottom:25px; border-radius:12px;">

    <h1 style="margin-bottom:10px;">Welcome to the DeepWeb</h1>

    <p style="opacity:0.7; margin-bottom:10px;">
        Safe Browser to people
    </p>

    <div class="verify-box" id="verifyBox">
        <div class="loader"></div>
        <p style="opacity:0.6; font-size:14px;">
            Memverifikasi anda bahwa anda bukan robot...
        </p>
    </div>

    <br>

    <button class="btn" id="enterBtn" onclick="enterSite()" disabled>
        Masuk
    </button>

</div>
    
<!-- HOME -->
<div id="home" style="display:none;">
    <h2 style="margin-bottom:25px;">Daftar Berita</h2>
    <div class="news-grid" id="newsList"></div>
</div>

<!-- DETAIL -->
<div class="detail" id="detailPage"></div>

<!-- REQUEST -->
<div class="request" id="requestPage">
    <h2 style="margin-bottom:15px;">Request Kasus</h2>
    <textarea placeholder="Tulis pesan kamu disini..."></textarea>
    <button class="btn" onclick="goHome()">Back</button>
</div>

</main>

<script>
function toggleSidebar(){
    document.getElementById("sidebar").classList.add("active");
    document.getElementById("overlay").classList.add("active");
}

function closeSidebar(){
    document.getElementById("sidebar").classList.remove("active");
    document.getElementById("overlay").classList.remove("active");
}

function enterSite(){
    document.getElementById("hero").style.display="none";
    document.getElementById("home").style.display="block";
}

function goHome(){
    document.getElementById("detailPage").style.display="none";
    document.getElementById("requestPage").style.display="none";
    document.getElementById("home").style.display="block";
    closeSidebar();
}

function openRequest(){
    document.getElementById("home").style.display="none";
    document.getElementById("detailPage").style.display="none";
    document.getElementById("requestPage").style.display="block";
    closeSidebar();
}

const newsData = [
{
title:"UIN VS PUBLIC",
kronologi:"Perdebatan besar terjadi antara pihak UIN dan Public setelah isu viral menyebar di media sosial. Klarifikasi dan tanggapan resmi kemudian dirilis.",
video:"https://youtube.com/"
},
{
title:"Kasus Viral Kota",
kronologi:"Kasus ini bermula dari laporan masyarakat dan menjadi viral dalam waktu singkat.",
video:"https://youtube.com/"
}
];

const newsList = document.getElementById("newsList");

newsData.forEach((news,index)=>{
    newsList.innerHTML += `
    <div class="news-card">
        <h3>${news.title}</h3>
        <button class="btn" onclick="openDetail(${index})">Baca Berita</button>
    </div>`;
});

function openDetail(index){
    const data = newsData[index];
    document.getElementById("home").style.display="none";
    const detail = document.getElementById("detailPage");

    detail.innerHTML = `
    <h2 style="margin-bottom:15px;">${data.title}</h2>
    <h3 style="margin-bottom:10px;">Kronologi</h3>
    <p style="margin-bottom:20px; line-height:1.6;">${data.kronologi}</p>
    <a href="${data.video}" target="_blank">
        <button class="btn">Link Video</button>
    </a>
    <br><br>
    <button class="btn" onclick="goHome()">Kembali</button>
    `;

    detail.style.display="block";
}
    // VERIFIKASI 7 DETIK
window.addEventListener("load", function(){
    const btn = document.getElementById("enterBtn");
    const verifyBox = document.getElementById("verifyBox");

    setTimeout(()=>{
        verifyBox.style.display="none";
        btn.disabled = false;
        btn.style.opacity="1";
    },7000);
});
</script>

</body>
</html>
