<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fahz-BlackNews</title>

<style>
/* ====== GLOBAL ====== */
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#000;
    color:#fff;
}

h1,h2,h3{
    margin:0;
}

button{
    padding:10px 15px;
    border:none;
    cursor:pointer;
    font-weight:bold;
    background:#fff;
    color:#000;
    transition:0.3s;
}

button:hover{
    background:#444;
    color:#fff;
}

/* ===== HEADER ===== */
header{
    background:#111;
    padding:15px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #333;
}

.logo{
    font-size:20px;
    font-weight:bold;
}

.hamburger{
    font-size:25px;
    cursor:pointer;
}

/* ===== SIDEBAR ===== */
.sidebar{
    position:fixed;
    top:0;
    left:-250px;
    width:250px;
    height:100%;
    background:#111;
    padding:20px;
    transition:0.3s;
    border-right:1px solid #333;
}

.sidebar.active{
    left:0;
}

.sidebar a{
    display:block;
    color:#fff;
    text-decoration:none;
    margin:15px 0;
}

.sidebar a:hover{
    color:#aaa;
}

/* ===== CONTENT ===== */
.container{
    padding:20px;
}

.news-card{
    background:#111;
    padding:15px;
    margin-bottom:15px;
    border:1px solid #333;
}

.news-card h3{
    margin-bottom:10px;
}

.detail{
    display:none;
    background:#111;
    padding:20px;
    border:1px solid #333;
}

/* ===== REQUEST PAGE ===== */
.request-page{
    display:none;
}

textarea{
    width:100%;
    height:120px;
    background:#000;
    color:#fff;
    border:1px solid #333;
    padding:10px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
    .container{
        padding:15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Fahz-BlackNews</div>
    <div class="hamburger" onclick="toggleSidebar()">☰</div>
</header>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
    <a href="#" onclick="showHome()">Home</a>
    <a href="#" onclick="showRequest()">Request Kasus</a>
</div>

<!-- LOGO SCREEN -->
<div class="container" id="logoScreen" style="text-align:center; margin-top:100px;">
    <h1>LOGO FAHZ-BLACKNEWS</h1>
    <p>(Ganti dengan logo kamu nanti)</p>
    <br>
    <button onclick="enterSite()">Masuk</button>
</div>

<!-- HOME NEWS -->
<div class="container" id="homePage" style="display:none;">
    <h2>Daftar Berita</h2>
    <br>
    <div id="newsList"></div>
</div>

<!-- DETAIL PAGE -->
<div class="container detail" id="detailPage"></div>

<!-- REQUEST PAGE -->
<div class="container request-page" id="requestPage">
    <h2>Request Kasus</h2>
    <br>
    <textarea placeholder="Tulis pesan kamu disini..."></textarea>
    <br><br>
    <button onclick="showHome()">Back</button>
</div>

<script>

/* ===== SIDEBAR ===== */
function toggleSidebar(){
    document.getElementById("sidebar").classList.toggle("active");
}

/* ===== NAVIGATION ===== */
function enterSite(){
    document.getElementById("logoScreen").style.display="none";
    document.getElementById("homePage").style.display="block";
}

function showHome(){
    document.getElementById("detailPage").style.display="none";
    document.getElementById("requestPage").style.display="none";
    document.getElementById("homePage").style.display="block";
    toggleSidebar();
}

function showRequest(){
    document.getElementById("homePage").style.display="none";
    document.getElementById("detailPage").style.display="none";
    document.getElementById("requestPage").style.display="block";
    toggleSidebar();
}

/* ===== DATA BERITA ===== */
const newsData = [
{
    title: "UIN VS PUBLIC",
    kronologi: "Terjadi perdebatan antara pihak UIN dan pihak Public terkait isu yang sedang viral. Kronologi lengkap dimulai dari postingan media sosial hingga klarifikasi resmi.",
    video: "https://youtube.com/"
},
{
    title: "Kasus Viral Kota",
    kronologi: "Kasus ini bermula dari laporan warga dan menjadi viral setelah tersebar di berbagai platform.",
    video: "https://youtube.com/"
}
];

/* ===== TAMPILKAN BERITA ===== */
const newsList = document.getElementById("newsList");

newsData.forEach((news, index)=>{
    const card = document.createElement("div");
    card.classList.add("news-card");

    card.innerHTML = `
        <h3>${news.title}</h3>
        <button onclick="openDetail(${index})">Baca Berita</button>
    `;

    newsList.appendChild(card);
});

/* ===== DETAIL BERITA ===== */
function openDetail(index){
    const news = newsData[index];

    document.getElementById("homePage").style.display="none";
    const detailPage = document.getElementById("detailPage");

    detailPage.innerHTML = `
        <h2>${news.title}</h2>
        <br>
        <h3>Kronologi</h3>
        <p>${news.kronologi}</p>
        <br>
        <a href="${news.video}" target="_blank">
            <button>Link Video</button>
        </a>
        <br><br>
        <button onclick="showHome()">Kembali</button>
    `;

    detailPage.style.display="block";
}

</script>

</body>
</html>
